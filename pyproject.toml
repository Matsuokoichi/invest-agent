[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "invest-agent"
version = "0.1.0"
description = "Investment Research Agent and independent evaluation harness"
requires-python = ">=3.11"
dependencies = [
  "jsonschema[format]>=4.23,<5"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9"
]

[project.scripts]
eval-harness = "eval_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

